<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Julian Date Conversion Tool</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            max-width: 100%;
            margin: 0 auto;
            padding: 16px;
            color: #333;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
            margin-bottom: 24px;
            color: #2c3e50;
            font-size: 1.8rem;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 600px;
            margin: 0 auto;
        }
        .section {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .section h2 {
            margin-top: 0;
            color: #3498db;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            font-size: 1.4rem;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            -webkit-appearance: none;
            box-sizing: border-box;
        }
        input[type="date"] {
            min-height: 44px;
        }
        input[type="number"] {
            min-height: 44px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 14px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            width: 100%;
            -webkit-appearance: none;
            font-weight: 600;
            margin-bottom: 8px;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:active {
            background-color: #1f6da8;
            transform: translateY(1px);
        }
        .result {
            margin-top: 16px;
            padding: 14px;
            border-radius: 8px;
            background-color: #f1f1f1;
            display: none;
            font-size: 1.1rem;
            font-weight: 500;
            text-align: center;
        }
        footer {
            text-align: center;
            margin-top: 30px;
            color: #7f8c8d;
            font-size: 14px;
            padding: 16px 0;
        }
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .section {
                padding: 16px;
            }
            h1 {
                font-size: 1.6rem;
                margin-bottom: 20px;
            }
            .section h2 {
                font-size: 1.3rem;
            }
            button {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <h1>Julian Date Conversion Tool</h1>
    
    <div class="container">
        <div class="section">
            <h2>Calendar to Julian</h2>
            <div class="input-group">
                <label for="calendarDate">Enter Calendar Date Below:</label>
                <input type="date" id="calendarDate">
            </div>
            <button id="convertToJulian">Click to Convert to Julian Date</button>
            <div id="julianResult" class="result">Julian Date: <span id="julianValue"></span></div>
        </div>

        <div class="section">
            <h2>Julian to Calendar</h2>
            <div class="input-group">
                <label for="julianDate">Enter Julian Date Below:</label>
                <input type="number" id="julianDate" placeholder="e.g., 25122">
            </div>
            <button id="convertToCalendar">Click to Convert to Calendar Date</button>
            <div id="calendarResult" class="result">Calendar Date: <span id="calendarValue"></span></div>
        </div>
    </div>

    <footer>
        <h3><b>Created by Quintin G.<b></h3>
    </footer>

    <script>
        // Function to calculate day of year (1-366)
        function getDayOfYear(date) {
            // Create a more reliable calculation of day of year
            const year = date.getFullYear();
            const month = date.getMonth();
            const day = date.getDate();
            
            // Array with days in each month (non-leap year)
            const daysInMonth = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            
            // Adjust February for leap years
            if (isLeapYear(year)) {
                daysInMonth[1] = 29;
            }
            
            // Calculate day of year
            let dayOfYear = day;
            for (let i = 0; i < month; i++) {
                dayOfYear += daysInMonth[i];
            }
            
            return dayOfYear;
        }

        // Function to check if a year is a leap year
        function isLeapYear(year) {
            return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
        }

        // Function to convert Calendar date to Julian date
        function calendarToJulian(year, month, day) {
            // Create date object
            const date = new Date(year, month - 1, day);
            
            // Extract last two digits of year
            const yearDigits = year % 100;
            
            // Calculate day of year (1-366)
            const dayOfYear = getDayOfYear(date);
            
            // Combine as YYDDD format
            return yearDigits * 1000 + dayOfYear;
        }

        // Function to convert Julian date to Calendar date
        function julianToCalendar(julianDate) {
            // Extract year and day of year
            const yearDigits = Math.floor(julianDate / 1000);
            const dayOfYear = julianDate % 1000;
            
            // Determine century (assuming 1900s if yearDigits >= 50, otherwise 2000s)
            const baseYear = yearDigits >= 50 ? 1900 : 2000;
            const fullYear = baseYear + yearDigits;
            
            // Create date for January 1st of that year
            const date = new Date(fullYear, 0, 1);
            
            // Add days (subtract 1 because Jan 1 is day 1)
            date.setDate(date.getDate() + dayOfYear - 1);
            
            // Extract components
            return {
                year: date.getFullYear(),
                month: date.getMonth() + 1, // JavaScript months are 0-based
                day: date.getDate()
            };
        }

        // Format date as YYYY-MM-DD
        function formatDate(year, month, day) {
            return `${year}-${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
        }

        // Format date in a more readable format
        function formatReadableDate(year, month, day) {
            const months = [
                'January', 'February', 'March', 'April', 'May', 'June', 
                'July', 'August', 'September', 'October', 'November', 'December'
            ];
            return `${months[month-1]} ${day}, ${year}`;
        }

        // Event handlers
        document.getElementById('convertToJulian').addEventListener('click', function() {
            const dateStr = document.getElementById('calendarDate').value;
            
            if (!dateStr) {
                alert('Please enter a valid date');
                return;
            }
            
            const dateParts = dateStr.split('-');
            const year = parseInt(dateParts[0]);
            const month = parseInt(dateParts[1]);
            const day = parseInt(dateParts[2]);
            
            const julianDate = calendarToJulian(year, month, day);
            
            document.getElementById('julianValue').textContent = julianDate;
            document.getElementById('julianResult').style.display = 'block';
        });

        document.getElementById('convertToCalendar').addEventListener('click', function() {
            const julianDateStr = document.getElementById('julianDate').value;
            
            if (!julianDateStr) {
                alert('Please enter a Julian date');
                return;
            }
            
            const julianDate = parseInt(julianDateStr);
            
            if (isNaN(julianDate)) {
                alert('Please enter a valid number');
                return;
            }
            
            const { year, month, day } = julianToCalendar(julianDate);
            
            document.getElementById('calendarValue').textContent = formatReadableDate(year, month, day);
            document.getElementById('calendarResult').style.display = 'block';
        });

        // Set default date to today
        const today = new Date();
        const todayFormatted = formatDate(
            today.getFullYear(),
            today.getMonth() + 1,
            today.getDate()
        );
        document.getElementById('calendarDate').value = todayFormatted;
    </script>
</body>
</html>
